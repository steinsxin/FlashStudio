name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: appimage
            platform: linux-x64
          - os: windows-2022
            bundle: nsis
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl file pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
      - run: npm ci
      - name: Prepare pinned bundled engine
        run: npm run engine:prepare -- --platform ${{ matrix.platform }}
      - name: Validate engine and backend
        run: |
          npm test
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build offline installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: flashstudio-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*-setup.exe
            packaging/openocd.lock.json
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
