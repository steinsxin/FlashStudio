name: Ubuntu package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read VERSION and synchronize package metadata
        run: |
          npm run version:sync
          npm run test:version
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file pkg-config dpkg-dev libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
      - name: Validate backend and pinned engine
        run: |
          npm ci
          npm run engine:prepare
          python3 scripts/test-prepare-openocd.py
          npm test
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build Ubuntu installer
        run: npm run package:ubuntu
      - name: Verify package in clean Ubuntu
        run: |
          # Runtime-only environment: no Rust, npm, system OpenOCD or build libraries.
          docker run --rm \
            -v "$GITHUB_WORKSPACE/dist-packages/ubuntu:/packages:ro" \
            -v "$GITHUB_WORKSPACE/packaging:/checks/packaging:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/checks/scripts:ro" \
            ubuntu:24.04 /bin/bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends python3 ca-certificates
              shopt -s nullglob
              packages=(/packages/*.deb)
              [[ "${#packages[@]}" -eq 1 ]]
              apt-get install -y --no-install-recommends "${packages[0]}"
              dpkg-query -W flash-studio
              useradd --create-home verifier
              runuser -u verifier -- bash /checks/packaging/linux/verify-install.sh
            '
      - name: Upload installable package
        uses: actions/upload-artifact@v7
        with:
          name: flashstudio-ubuntu-24.04-amd64
          path: dist-packages/ubuntu/*
          if-no-files-found: error
          retention-days: 30
